# Alur otomatis: setiap push / pull request diuji; bila lulus dan berada di branch default,
# hasil build dipasang ke GitHub Pages.
# Prasyarat sekali saja: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Uji dan pasang dasbor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uji:
    name: Uji (tipe, indikator, data, penerimaan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pemeriksaan tipe TypeScript
        run: npx tsc -b
      - name: Uji modul indikator (expected_indicators.json)
        run: npm test
      - name: Pemeriksaan data 8.2
        run: npm run periksa-data
      - name: Build
        run: npm run build
      - name: Pasang Chromium untuk uji penerimaan
        run: npx playwright-core install --with-deps chromium
      - name: Uji penerimaan antarmuka (bagian 9)
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.1 http://localhost:4173/ --timeout 60000
          npm run uji:penerimaan
      - name: Simpan hasil uji (PDF, tangkapan layar, tabel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-uji
          path: hasil-uji/
      - name: Siapkan artefak GitHub Pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  pasang:
    name: Pasang ke GitHub Pages
    needs: uji
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pasang.outputs.page_url }}
    steps:
      - id: pasang
        uses: actions/deploy-pages@v4
