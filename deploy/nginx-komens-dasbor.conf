# Contoh konfigurasi Nginx untuk server Pusdatinrenbang.
# Salin ke /etc/nginx/conf.d/komens-dasbor.conf, sesuaikan server_name dan sertifikat, lalu: nginx -t && systemctl reload nginx
server {
    listen 443 ssl http2;
    server_name dasbor-komens.example.bappenas.go.id;   # ganti dengan nama host internal

    ssl_certificate     /etc/ssl/certs/dasbor-komens.crt;
    ssl_certificate_key /etc/ssl/private/dasbor-komens.key;

    root  /var/www/komens-dasbor;      # isi dari folder dist/
    index index.html;

    # Batasi ke jaringan internal (sesuaikan rentang IP).
    # allow 10.0.0.0/8;
    # deny  all;

    # Header keamanan dasar.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;

    # Data CSV selalu diambil terbaru setelah diperbarui.
    location /data/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        types { text/csv csv; }
        charset utf-8;
    }

    # Aset ber-hash dapat disimpan lama di peramban.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript text/csv application/json;
}
